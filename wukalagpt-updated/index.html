    <script>
      (function() {
        const saved = localStorage.getItem('theme');
        const isDark = saved ? saved === 'dark' : true;
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
