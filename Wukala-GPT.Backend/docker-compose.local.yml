version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wukala_postgres_local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: u6mJQUA2
      POSTGRES_DB: WukalaGPT
    ports:
      - "5432:5432"
    volumes:
      - wukala_pgdata_local:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wukala_redis_local
    ports:
      - "6379:6379"

volumes:
  wukala_pgdata_local:
