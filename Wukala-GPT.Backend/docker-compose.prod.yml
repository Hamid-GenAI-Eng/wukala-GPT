version: '3.8'

services:
  # The Core API Server
  wukala_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wukala_api_prod
    restart: unless-stopped
    ports:
      - "5285:80"    # Expose the API ONLY on port 5285 to the Host
    env_file:
      - .env
    volumes:
      - wukala_logs:/app/logs
    depends_on:
      wukala_postgres:
        condition: service_healthy
      wukala_redis:
        condition: service_started
    networks:
      - wukala_backend_net

  # Isolated PostgreSQL Database
  wukala_postgres:
    image: postgres:15-alpine
    container_name: wukala_postgres_prod
    restart: unless-stopped
    environment:
      # These must match exactly what is in your .env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-u6mJQUA2}
      POSTGRES_DB: WukalaGPT
    volumes:
      - wukala_pgdata:/var/lib/postgresql/data
    # NO PORTS BOUND! This prevents Ransomware scanning from hitting 5432.
    # It is ONLY accessible internally via the `wukala_backend_net` network.
    networks:
      - wukala_backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d WukalaGPT"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Isolated Redis Cache and SignalR Backplane
  wukala_redis:
    image: redis:7-alpine
    container_name: wukala_redis_prod
    restart: unless-stopped
    # If adding a password, use: command: redis-server --requirepass ${REDIS_PASSWORD}
    command: redis-server
    volumes:
      - wukala_redisdata:/data
    # NO PORTS BOUND! This prevents Redis flushing/DDoS bots from hitting 6379 natively.
    networks:
      - wukala_backend_net

volumes:
  wukala_pgdata:
  wukala_redisdata:
  wukala_logs:

networks:
  wukala_backend_net:
    driver: bridge
