version: "1"

databases:
  - name: wukala-db
    databaseName: wukala_gpt
    user: wukala_user

services:
  - type: pserv
    name: wukala-redis
    env: image
    image:
      url: redis:alpine
    plan: starter
    disk:
      name: redis-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "6379"

  - type: web
    name: wukala-backend
    env: docker
    dockerfilePath: Wukala-GPT.Backend/Dockerfile
    dockerContext: Wukala-GPT.Backend
    plan: starter
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: wukala-db
          property: connectionString
      - key: ConnectionStrings__Redis
        value: "wukala-redis:6379,abortConnect=false"
      - key: JwtSettings__Secret
        sync: false # Set in Render Dashboard
      - key: Cloudinary__CloudName
        sync: false # Set in Render Dashboard
      - key: Cloudinary__ApiKey
        sync: false # Set in Render Dashboard
      - key: Cloudinary__ApiSecret
        sync: false # Set in Render Dashboard
      - key: Resend__ApiKey
        sync: false # Set in Render Dashboard
      - key: Cors__AllowedOrigins__0
        value: "https://www.wukala-gpt.app" 
      - key: ASPNETCORE_ENVIRONMENT
        value: "Production"

  - type: pserv
    name: mizan-api
    env: docker
    dockerfilePath: Mizan.AI/Dockerfile
    dockerContext: Mizan.AI
    plan: starter
    disk:
      name: mizan-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["https://www.wukala-gpt.app", "http://wukala-backend:8080"]' 
      - key: QDRANT_HOST
        value: "qdrant-db" # Uses internal Render network DNS
      - key: QDRANT_PORT
        value: "6333"

  - type: pserv
    name: qdrant-db
    env: image
    image:
      url: qdrant/qdrant:latest
    plan: starter
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 5
    envVars:
      - key: PORT
        value: "6333"
