version: "1"

databases:
  - name: wukala-db
    databaseName: wukala_gpt
    user: wukala_user

services:
  - type: pserv
    name: wukala-redis
    env: image
    image:
      url: redis:alpine
    plan: starter
    disk:
      name: redis-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "6379"

  - type: web
    name: wukala-backend
    env: docker
    dockerfilePath: Wukala-GPT.Backend/Dockerfile
    dockerContext: Wukala-GPT.Backend
    plan: starter
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: wukala-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: pserv
          name: wukala-redis
          property: host
      - key: ConnectionStrings__Redis
        value: "REPLACE_ME_REDIS_IN_CODE"
      - key: JwtSettings__Secret
        sync: false # Set in Render Dashboard
      - key: Cloudinary__CloudName
        sync: false # Set in Render Dashboard
      - key: Cloudinary__ApiKey
        sync: false # Set in Render Dashboard
      - key: Cloudinary__ApiSecret
        sync: false # Set in Render Dashboard
      - key: Resend__ApiKey
        sync: false # Set in Render Dashboard
      - key: Resend__FromEmail
        value: "no-reply@codeenvisiontechnologies.com"
      - key: Cors__AllowedOrigins__0
        value: "https://www.wukala-gpt.app" 
      - key: ASPNETCORE_ENVIRONMENT
        value: "Production"
      - key: MizanAi__BaseUrl
        fromService:
          type: web
          name: mizan-api
          property: host

  - type: web
    name: mizan-api
    env: docker
    dockerfilePath: Mizan.AI/Dockerfile
    dockerContext: Mizan.AI
    plan: "pro plus"
    disk:
      name: mizan-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["https://www.wukala-gpt.app", "http://wukala-backend:8080"]' 
      - key: QDRANT_HOST
        fromService:
          type: pserv
          name: qdrant-db
          property: host
      - key: QDRANT_PORT
        value: "6333"
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard
      - key: HF_TOKEN
        sync: false # Optional: Set in Render Dashboard to prevent HuggingFace rate limits
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"

  - type: pserv
    name: qdrant-db
    env: image
    image:
      url: qdrant/qdrant:latest
    plan: starter
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 5
    envVars:
      - key: PORT
        value: "6333"
