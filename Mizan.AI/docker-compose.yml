version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mizan_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  mizan-api:
    build: .
    image: mizan_api_local
    container_name: mizan_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - qdrant
    env_file:
      - .env
    restart: unless-stopped

